# =============================================================================
# Netlify configuration - VOICEUP AI
# -----------------------------------------------------------------------------
# Netlify hosts the STATIC frontend only. All backend work (auth checks,
# AI provider calls, transcription, speech synthesis, scoring, persistence)
# runs in Firebase Cloud Functions. We deliberately do NOT deploy Netlify
# Functions: duplicating the backend in two places would double the secret
# surface and split the data model. See docs/ARCHITECTURE.md.
# =============================================================================

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# --- SPA routing: every unknown path is handled by the React router --------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers ------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "off"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Deploy previews -------------------------------------------------------
# When the Netlify site is linked to the GitHub repo, every pull request
# automatically gets its own preview URL. Point these at a staging Firebase
# project so previews never write to production data.
[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"

[context.branch-deploy.environment]
  VITE_APP_ENV = "staging"

[context.production.environment]
  VITE_APP_ENV = "production"
